<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即应应用通道接入测试</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161a21;
    --panel-2: #1c2129;
    --border: #272d38;
    --text: #d8dee9;
    --muted: #8b94a5;
    --accent: #4ade80;
    --out: #60a5fa;
    --in: #f0b429;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #4b5563; display: inline-block; margin-right: 6px;
  }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px rgba(74,222,128,.6); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 360px 1fr;
    min-height: 0;
  }
  .side { border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  .stream-wrap { display: flex; flex-direction: column; min-height: 0; }
  .stream-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: 12px;
  }
  #stream { flex: 1; overflow-y: auto; padding: 8px 16px 20px; }
  fieldset {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin: 0 0 14px;
  }
  legend { color: var(--muted); padding: 0 6px; font-size: 12px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
  input[type=text], input[type=number], textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px;
    font: inherit; font-size: 13px;
  }
  textarea { resize: vertical; min-height: 56px; }
  input:focus, textarea:focus { outline: none; border-color: #3b82f6; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    font: inherit; font-size: 13px; cursor: pointer;
    background: #232a35; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
  }
  button:hover { background: #2b3341; }
  button.primary { background: #1d4ed8; border-color: #2563eb; color: #eff6ff; }
  button.primary:hover { background: #2563eb; }
  button.danger { background: #7f1d1d; border-color: #991b1b; color: #fee2e2; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-row button { flex: 1; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; line-height: 1.5; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .line { display: flex; gap: 8px; padding: 2px 0; align-items: baseline; }
  .line .t { color: #56607280; color: #566072; flex: none; }
  .line .tag {
    flex: none; width: 58px; font-weight: 600; font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .4px;
  }
  .line .msg { white-space: pre-wrap; word-break: break-word; min-width: 0; }
  .line.out .tag { color: var(--out); }
  .line.in .tag { color: var(--in); }
  .line.sys .tag { color: var(--accent); }
  .line.err .tag, .line.err .msg { color: var(--err); }
  .line.dim .msg { color: var(--muted); }
  #stream .empty { color: var(--muted); padding-top: 8px; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--border); max-height: 52vh; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>即应应用通道接入测试</h1>
  <span class="sub" id="status">未连接</span>
</header>

<main>
  <section class="side">
    <fieldset>
      <legend>接入凭据</legend>
      <label for="url">WS 地址</label>
      <input type="text" id="url" placeholder="wss://<host>/api/app/ws">
      <label for="appid">App ID</label>
      <input type="text" id="appid" placeholder="应用 UUID">
      <label for="secret">连接密钥</label>
      <input type="text" id="secret" placeholder="Connection Secret">
      <div class="btn-row">
        <button class="primary" id="connectBtn">连接</button>
        <button class="danger" id="disconnectBtn" disabled>断开</button>
      </div>
      <div class="hint">握手头：<code>X-MagicChat-App-ID</code>（须 UUID）与 <code>Authorization: Bearer &lt;连接密钥&gt;</code>。</div>
    </fieldset>

    <fieldset>
      <legend>发送文本消息</legend>
      <label for="conv">会话 ID</label>
      <input type="text" id="conv" placeholder="conversation_id">
      <label for="text">内容</label>
      <textarea id="text" placeholder="要发送的文本">接入测试：你好</textarea>
      <div class="btn-row">
        <button id="sendTextBtn" disabled>message.send</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>原始请求</legend>
      <label for="method">method</label>
      <input type="text" id="method" value="events.ack">
      <label for="payload">payload（JSON）</label>
      <textarea id="payload">{"cursor": 1}</textarea>
      <div class="btn-row">
        <button id="sendRawBtn" disabled>发送请求</button>
      </div>
      <label class="check"><input type="checkbox" id="autoAck" checked> 收到事件后自动 events.ack</label>
    </fieldset>
  </section>

  <section class="stream-wrap">
    <div class="stream-head">
      <span>事件流</span>
      <span>
        <button id="clearBtn" style="padding:3px 8px;font-size:12px">清空</button>
      </span>
    </div>
    <div id="stream"><div class="empty">连接后在此查看收发的 envelope。</div></div>
  </section>
</main>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var ws = null, seq = 0, lastCursor = 0;
  function now() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, '0'); }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function log(cls, tag, text) {
    var empty = $('#stream .empty');
    if (empty) empty.remove();
    var line = document.createElement('div');
    line.className = 'line ' + cls;
    var t = document.createElement('span'); t.className = 't'; t.textContent = now();
    var g = document.createElement('span'); g.className = 'tag'; g.textContent = tag;
    var m = document.createElement('span'); m.className = 'msg'; m.textContent = text;
    line.appendChild(t); line.appendChild(g); line.appendChild(m);
    var view = $('#stream');
    view.appendChild(line);
    view.scrollTop = view.scrollHeight;
  }
  function pretty(obj) {
    try { return JSON.stringify(obj, null, 2); } catch (e) { return String(obj); }
  }
  function setConnected(on, label) {
    $('#dot').classList.toggle('on', on);
    $('#status').textContent = label;
    $('#connectBtn').disabled = on;
    $('#disconnectBtn').disabled = !on;
    $('#sendTextBtn').disabled = !on;
    $('#sendRawBtn').disabled = !on;
  }
  function sendEnv(method, payload) {
    if (!ws || ws.readyState !== WebSocket.OPEN) { log('err', 'ERR', '未连接'); return null; }
    var id = 'web-' + Date.now() + '-' + (++seq);
    var env = { v: 1, kind: 'request', id: id, method: method, payload: payload };
    ws.send(JSON.stringify(env));
    log('out', 'SEND', method + '\n' + pretty(payload));
    return id;
  }
  function ackCursor(cursor) {
    if (!cursor) return;
    if (cursor <= lastCursor) { log('dim', 'SKIP', '已确认 cursor=' + cursor); return; }
    lastCursor = cursor;
    sendEnv('events.ack', { cursor: cursor });
  }
  function connect() {
    var url = $('#url').value.trim();
    var appid = $('#appid').value.trim();
    var secret = $('#secret').value.trim();
    if (!url || !appid || !secret) { log('err', 'ERR', '请填写 WS 地址、App ID 与连接密钥'); return; }
    try {
      ws = new WebSocket(url);
    } catch (e) {
      log('err', 'ERR', '创建连接失败：' + e.message);
      return;
    }
    setConnected(true, '连接中…');
    log('sys', 'INFO', '正在连接 ' + url);
    ws.onopen = function () {
      setConnected(true, '已连接');
      log('sys', 'OPEN', '握手成功，等待事件');
    };
    ws.onmessage = function (ev) {
      var env;
      try { env = JSON.parse(ev.data); } catch (e) { log('in', 'RAW', ev.data); return; }
      if (env.kind === 'event') {
        log('in', 'EVENT', env.event + (env.cursor ? ' · cursor=' + env.cursor : '') + '\n' + pretty(env.payload || {}));
        if ($('#autoAck').checked && env.cursor) ackCursor(env.cursor);
      } else {
        log(env.ok === false ? 'err' : 'in', 'RESP',
          (env.method || 'response') + ' · reply_to=' + (env.reply_to || '-') + ' · ok=' + env.ok +
          '\n' + pretty(env.payload || env.error || {}));
      }
    };
    ws.onerror = function () { log('err', 'ERR', '连接发生错误'); };
    ws.onclose = function (ev) {
      setConnected(false, '已断开');
      log('sys', 'CLOSE', '连接关闭 code=' + ev.code + (ev.reason ? ' reason=' + ev.reason : ''));
      ws = null;
    };
  }
  function disconnect() {
    if (ws) { log('sys', 'INFO', '主动断开'); ws.close(); }
  }
  $('#connectBtn').addEventListener('click', connect);
  $('#disconnectBtn').addEventListener('click', disconnect);
  $('#clearBtn').addEventListener('click', function () {
    $('#stream').innerHTML = '<div class="empty">连接后在此查看收发的 envelope。</div>';
  });
  $('#sendTextBtn').addEventListener('click', function () {
    var conv = $('#conv').value.trim();
    var text = $('#text').value;
    if (!conv || !text) { log('err', 'ERR', '缺少会话 ID 或内容'); return; }
    sendEnv('message.send', {
      target: { type: 'conversation', conversation_id: conv },
      message: { type: 'text', content: text }
    });
  });
  $('#sendRawBtn').addEventListener('click', function () {
    var method = $('#method').value.trim();
    var payload;
    try { payload = JSON.parse($('#payload').value); } catch (e) { log('err', 'ERR', 'payload 不是合法 JSON'); return; }
    sendEnv(method, payload);
  });
  // 预填本次部署的外部地址，便于直接开始测试。
  (function () {
    if (location.hostname.indexOf('monkeycode-ai.online') >= 0) {
      $('#url').value = 'wss://' + location.hostname.replace(/^18080-/, '20080-') + '/api/app/ws';
    } else {
      $('#url').value = 'ws://127.0.0.1:20080/api/app/ws';
    }
  })();
})();
</script>
</body>
</html>
